<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wayback Audit{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="/" class="brand">
            <span class="brand-mark">📚</span>
            <span class="brand-text">Wayback Audit</span>
        </a>
        <nav class="topnav">
            <a href="/" class="nav-link">Проекты</a>
            <a href="/new" class="btn btn-primary">+ Новый проект</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash flash-{{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <span class="muted">Wayback Audit · 2026</span>
    </footer>
</body>
</html>
